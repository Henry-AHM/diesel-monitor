name: Weekly refresh

on:
  schedule:
    - cron: "0 18 * * 3"   # Wednesday 18:00 UTC = Thursday 7am NZ daylight time (6am in winter)
  workflow_dispatch:        # "Run workflow" button for an on-demand refresh

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      TZ: Pacific/Auckland
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download data and rebuild the page
        run: |
          python refresh_diesel.py
          cp diesel.html index.html
      - name: Commit if anything changed
        run: |
          git config user.name "diesel-monitor bot"
          git config user.email "261809821+Henry-AHM@users.noreply.github.com"
          git add data.json index.html
          git diff --cached --quiet || git commit -m "Weekly refresh $(date +%Y-%m-%d)"
          git push
